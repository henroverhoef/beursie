<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beursie</title>
<meta name="theme-color" content="#0f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one-column pocket ledger, max 520px, fixed bottom tab bar; big rand figures in the display face. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#16211c; --muted:#5b6a62; --line:#dbe2dd; --chip:#e6ebe7;
  --accent:#0f6b4f; --accent-ink:#ffffff; --accent-soft:#d8ebe2;
  --good:#2f7d4f; --warn:#a86a10; --bad:#c2412d; --warn-soft:#f6ead2; --bad-soft:#f7ddd7;
  --display:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#17201b; --ink:#e5ece7; --muted:#93a39a; --line:#29342e; --chip:#222c26;
  --accent:#3dbd8c; --accent-ink:#04140c; --accent-soft:#16352a;
  --good:#5cc28a; --warn:#e2a740; --bad:#ef6b54; --warn-soft:#3a2d12; --bad-soft:#3d1c16; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#17201b; --ink:#e5ece7; --muted:#93a39a; --line:#29342e; --chip:#222c26;
  --accent:#3dbd8c; --accent-ink:#04140c; --accent-soft:#16352a;
  --good:#5cc28a; --warn:#e2a740; --bad:#ef6b54; --warn-soft:#3a2d12; --bad-soft:#3d1c16; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.15rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.brand{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--accent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* add screen */
.amount{font-family:var(--display);font-size:3.2rem;font-weight:700;text-align:center;padding:6px 0 2px;letter-spacing:-.02em;min-height:4.4rem}
.amount .cur{color:var(--muted);font-size:1.6rem;margin-right:4px;vertical-align:.7em}
.amount.empty{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
#chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-padding:16px}
#chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 9px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;max-width:100%}
.chip b{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{font-size:.72rem;color:var(--muted)}
.chip small.warn{color:var(--warn)} .chip small.bad{color:var(--bad)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--chip);border:0;border-radius:12px;padding:11px 0;font-family:var(--display);font-size:1.4rem;font-weight:500}
.pad button:active{filter:brightness(.92)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:15px;font-weight:700;font-size:1.05rem;width:100%}
.primary:disabled{opacity:.55}
#saveTx{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 0 0 6px var(--bg)}
.row.between > :last-child{white-space:nowrap}
.amount{position:sticky;top:0;background:var(--bg);z-index:4}
.ghost{background:var(--chip);border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.danger{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* overview */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px}
.hero .big{font-family:var(--display);font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .sub{opacity:.9;font-size:.9rem}
.pace{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);position:relative;margin-top:12px;overflow:hidden}
.pace i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-ink);border-radius:99px}
.pace em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent-ink);opacity:.6}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft)}
.alert.bad{background:var(--bad-soft)}
.alert.info{background:var(--accent-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.alert.bad .dot{background:var(--bad)} .alert.info .dot{background:var(--accent)}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .fig{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.pill{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--muted);letter-spacing:.02em}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--accent-soft);color:var(--good)}
.groupname{margin-top:10px}
.toast{display:flex;align-items:center;gap:12px}
.toast-act{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:2px 0;flex:none}
.favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:7px 11px;font-weight:600;font-size:.86rem;white-space:nowrap}
.fav span{color:var(--muted);font-weight:500;margin-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{font-family:var(--display);font-size:1.25rem;display:block;font-variant-numeric:tabular-nums}
.rtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}
.rtable td,.rtable th{padding:7px 0;border-top:1px solid var(--line);text-align:right}
.rtable th{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-top:0}
.rtable td:first-child,.rtable th:first-child{text-align:left;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.rline{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.rline small{color:var(--muted);grid-column:1/-1}
.goal{padding:8px 0;border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button.cat{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
button.alert{border:0;width:100%;text-align:left;color:inherit}
.tapcard{cursor:pointer}
.chev{color:var(--muted);font-size:1.1rem;line-height:1}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

/* history */
.day{margin-top:12px}
.tx{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.tx .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s{font-size:.8rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tx .a.in{color:var(--good)}
.tx .s.review{color:var(--warn);font-weight:600}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroller .ghost{white-space:nowrap}
.scroller .ghost[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* budget editor */
.edrow{display:grid;grid-template-columns:1fr 104px;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.edrow .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sumrow{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.warn{background:var(--warn);color:#fff} .toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){ .toast{animation:up .18s ease-out} @keyframes up{from{opacity:0;transform:translate(-50%,-8px)}} }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
  <button data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>History</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Budget</button>
</div></nav>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json" hidden>
<div id="layer"></div>

<script>
'use strict';
/* =========================================================
   Beursie — personal budget tracker. All data stays on this
   device (localStorage). Export CSV/JSON to back up or share.
   ========================================================= */
const KEY = 'beursie.v1';
const GROUPS = ['Needs','Giving','Lifestyle','Saving'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = (n, dp=0) => (n < 0 ? '-R ' : 'R ') + Math.abs(n).toLocaleString('en-ZA',{minimumFractionDigits:dp,maximumFractionDigits:dp}).replace(/,/g,' ');
const round2 = n => Math.round(n*100)/100;

function blankState(){
  return { v:1, setupDone:false, salary:0, startDay:25, alertPct:80, monthsCover:3,
    autoRecurring:true, notify:false, fundOpening:0, lastExport:null,
    categories:[
      {id:'rent',name:'Rent',group:'Needs',budget:0,fixed:true},
      {id:'groc',name:'Groceries',group:'Needs',budget:0},
      {id:'fuel',name:'Fuel',group:'Needs',budget:0},
      {id:'eat',name:'Eating out & coffee',group:'Lifestyle',budget:0},
      {id:'subs',name:'Subscriptions',group:'Lifestyle',budget:0,fixed:true},
      {id:'hob',name:'Hobbies & sport',group:'Lifestyle',budget:0},
      {id:'fund',name:'Lumpsum fund',group:'Saving',budget:0,fixed:true,fund:true},
    ],
    recurring:[], rules:[], tx:[], posted:{}, alerted:{},
    favs:[], goals:[], goalMoves:[], reviewed:{}, rolled:{},
    drive:{ clientId:'', fileId:null, last:null, connected:false, auto:true } };
}

/* ---------- storage ---------- */
let S;
let memoryOnly = false;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : blankState(); }
  catch(e){ S = blankState(); memoryOnly = true; }
  S = Object.assign(blankState(), S);
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memoryOnly = true; toast('Could not save on this device. Export a backup now.','bad'); }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ---------- dates & periods ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
function periodOf(date){
  const sd = Math.min(Math.max(1, S.startDay|0), 28);
  let y = date.getFullYear(), m = date.getMonth();
  if (date.getDate() < sd){ m--; if (m < 0){ m = 11; y--; } }
  const start = new Date(y, m, sd), end = new Date(y, m+1, sd-1);
  return { start, end, key: iso(start), label: `${short(start)} – ${short(end)}` };
}
const shiftPeriod = (p, n) => periodOf(new Date(p.start.getFullYear(), p.start.getMonth()+n, p.start.getDate()));
const inPeriod = (t, p) => t.date >= iso(p.start) && t.date <= iso(p.end);
const daysBetween = (a, b) => Math.round((b - a) / 86400000);

/* ---------- maths ---------- */
const catById = id => S.categories.find(c => c.id === id);
const countsInBudget = t => t.kind === 'expense' && !t.fromFund;
function spentBy(p){
  const m = {};
  for (const t of S.tx) if (countsInBudget(t) && t.catId && inPeriod(t,p)) m[t.catId] = round2((m[t.catId]||0) + t.amount);
  return m;
}
function fundBalance(){
  let b = +S.fundOpening || 0;
  for (const t of S.tx){
    const c = catById(t.catId);
    if (t.kind === 'expense' && !t.fromFund && c && c.fund) b += t.amount;
    if (t.kind === 'expense' && t.fromFund) b -= t.amount;
  }
  return round2(b);
}
const essentials = () => S.categories.filter(c => c.group==='Needs' || c.group==='Giving').reduce((a,c)=>a+(+c.budget||0),0);
const floorAmt = () => essentials() * (+S.monthsCover||0);
function summary(p){
  const sp = spentBy(p);
  const flex = S.categories.filter(c => !c.fixed && c.group !== 'Saving');
  const flexBudget = flex.reduce((a,c)=>a+(+c.budget||0),0);
  const flexSpent = flex.reduce((a,c)=>a+(sp[c.id]||0),0);
  const total = S.categories.reduce((a,c)=>a+(+c.budget||0),0);
  const uncat = S.tx.filter(t => t.kind==='expense' && !t.catId && inPeriod(t,p)).reduce((a,t)=>a+t.amount,0);
  return { sp, flexBudget, flexSpent, total, uncat };
}
const isFlex = c => c && !c.fixed && c.group !== 'Saving';
function flexSpentOn(p, from, to){ // inclusive ISO dates within period
  let a = 0;
  for (const t of S.tx){ if (!countsInBudget(t) || !inPeriod(t,p) || t.date < from || t.date > to) continue; const c = catById(t.catId); if (isFlex(c)) a += t.amount; }
  return round2(a);
}
function daily(){
  const p = periodOf(today()), td = iso(today());
  const flexBudget = S.categories.filter(isFlex).reduce((a,c)=>a+(+c.budget||0),0);
  const before = flexSpentOn(p, iso(p.start), iso(new Date(today().getTime()-86400000)));
  const spent = flexSpentOn(p, td, td);
  const daysLeft = daysBetween(today(), p.end) + 1;
  const allowance = Math.max(0, (flexBudget - before) / daysLeft);
  const tomorrow = daysLeft > 1 ? Math.max(0, (flexBudget - before - spent) / (daysLeft - 1)) : 0;
  return { p, flexBudget, before, spent, daysLeft, allowance, tomorrow, left: allowance - spent };
}
function catState(c, spent){
  const b = +c.budget || 0;
  if (!b) return spent > 0 ? 'bad' : 'none';
  const pct = spent / b * 100;
  if (pct > 100.5) return 'bad';
  if (pct >= S.alertPct) return 'warn';
  return 'good';
}

/* ---------- recurring ---------- */
function dueDate(r, p){
  const sd = p.start.getDate();
  let y = p.start.getFullYear(), m = p.start.getMonth();
  if (r.day < sd){ m++; }
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(r.day, last));
}
function postRecurring(){
  if (!S.autoRecurring) return 0;
  const p = periodOf(today()); let n = 0;
  for (const r of S.recurring){
    if (!r.active || !catById(r.catId)) continue;
    const k = p.key + ':' + r.id, d = dueDate(r, p);
    if (S.posted[k] || d > today() || (S.autoFrom && iso(d) < S.autoFrom)) continue;
    S.tx.push({ id:uid(), date:iso(d), amount:+r.amount, kind:'expense', catId:r.catId, note:r.note || catById(r.catId).name, source:'recurring', recId:r.id });
    S.posted[k] = 1; n++;
  }
  if (n) save();
  return n;
}

/* ---------- alerts ---------- */
function alertsFor(p){
  const out = [], { sp, flexBudget, flexSpent } = summary(p), now = today();
  const len = daysBetween(p.start, p.end) + 1, gone = Math.min(len, daysBetween(p.start, now) + 1);
  for (const c of S.categories){
    if (c.group === 'Saving') continue;
    const s = sp[c.id] || 0, st = catState(c, s);
    if (st === 'bad') out.push({ lvl:'bad', cat:c.id, text:`${c.name} is over budget: ${R(s)} of ${R(+c.budget||0)}.` });
    else if (st === 'warn' && !c.fixed) out.push({ lvl:'warn', cat:c.id, text:`${c.name} is at ${Math.round(s/c.budget*100)}% with ${len-gone} days to go.` });
  }
  if (flexBudget && p.key === periodOf(now).key){
    const spentPct = flexSpent/flexBudget*100, timePct = gone/len*100;
    if (spentPct > timePct + 15) out.push({ lvl:'warn', action:'flex', text:`You're ahead of pace: ${Math.round(spentPct)}% of flexible money spent, ${Math.round(timePct)}% of the month gone.` });
  }
  const fb = fundBalance(), fl = floorAmt();
  if (fl && (S.fundOpening || S.tx.some(t=>t.fromFund)) && fb < fl) out.push({ lvl:'bad', action:'fund', text:`Lumpsum fund is below its emergency floor (${R(fb)} of ${R(fl)}). Double the contribution until it's back.` });
  const rev = S.tx.filter(t => t.kind==='expense' && !t.catId).length;
  if (rev) out.push({ lvl:'info', text:`${rev} imported transaction${rev>1?'s':''} need a category.`, action:'review' });
  if (S.goals.length && freeMoney() < -1) out.push({ lvl:'warn', action:'goals', text:`Your goals hold ${R(-freeMoney())} more than what's above the emergency floor. Take some out of a goal or top up the fund.` });
  const lastB = [S.lastExport, S.drive.last].filter(Boolean).sort().pop();
  const lastEx = lastB ? daysBetween(parseISO(lastB), now) : null;
  if (S.tx.length > 20 && (lastEx === null || lastEx > 30)) out.push({ lvl:'info', text: lastEx===null ? 'You haven’t backed up yet. Your data lives only on this device.' : `Last backup was ${lastEx} days ago.`, action:'backup' });
  return out;
}
function notify(text){
  if (!S.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification('Beursie', { body:text, icon:'icon-192.png', tag:text.slice(0,30) }));
    else new Notification('Beursie', { body:text });
  } catch(e){}
}
function checkThresholds(catId){
  const c = catById(catId); if (!c || !c.budget || c.group==='Saving') return null;
  const p = periodOf(today()), s = spentBy(p)[catId] || 0, pct = s / c.budget * 100;
  const left = c.budget - s;
  let lvl = null, msg = `${c.name}: ${R(Math.max(0,left))} left (${Math.round(pct)}% used)`;
  if (pct > 100.5){ lvl='bad'; msg = `${c.name} is ${R(-left)} over budget.`; }
  else if (pct >= S.alertPct){ lvl='warn'; }
  if (lvl){ const k = p.key+':'+catId+':'+lvl; if (!S.alerted[k]){ S.alerted[k]=1; save(); notify(msg); } }
  return { lvl, msg };
}

/* ---------- bank CSV import ---------- */
const BUILTIN_RULES = [
  ['salaries','@income'],['salary','@income'],['transfer from','@transfer'],['inetbnk trf','@transfer'],['deposit cap trf','@transfer'],
  ['uber eats','Eating out & coffee'],['mr d','Eating out & coffee'],['kfc','Eating out & coffee'],['nandos','Eating out & coffee'],['mcd ','Eating out & coffee'],
  ['engen','Fuel'],['sasol','Fuel'],['shell ','Fuel'],['bp ','Fuel'],['caltex','Fuel'],['astron','Fuel'],['total ','Fuel'],['petrostop','Fuel'],['tng fuel','Fuel'],
  ['tapngo','Tolls, parking & Uber'],['tapng','Tolls, parking & Uber'],['tap n','Tolls, parking & Uber'],['toll','Tolls, parking & Uber'],['parking','Tolls, parking & Uber'],['uber','Tolls, parking & Uber'],
  ['pnp','Groceries'],['spar','Groceries'],['woolworths','Groceries'],['checkers','Groceries'],['shoprite','Groceries'],['ok foods','Groceries'],
  ['dischem','Personal care & health'],['clicks','Personal care & health'],
  ['transaction charge','Bank fees'],['proof of paymt','Bank fees'],['monthly fee','Bank fees'],['archive stmt','Bank fees'],
  ['vodacom','Phone & data'],['mtn','Phone & data'],['telkom','Phone & data'],
  ['playtomic','Hobbies & sport'],['takealot','Hobbies & sport'],['temu','Hobbies & sport'],
  ['cafe','Eating out & coffee'],['caffe','Eating out & coffee'],['coffee','Eating out & coffee'],['cappuccinos','Eating out & coffee'],['bakery','Eating out & coffee'],
];
function cleanDesc(d){
  return String(d).replace(/\s+/g,' ')
    .replace(/^(POS (PURCHASE|INTER PURC|CASH WDL|REFUND CLIENT)|DIGITAL PAYMENT DT ABSA BANK|DIGITAL TRANSF DT ABSA BANK|IMDTE DIGITAL PMT REF:\s*ABSA BANK|PayShap Ext (Debit|Credit) REF:|DIRECT DEBIT|DIRECT CREDIT|CASHSEND DIGITAL ABSA BANK|INETBNK (TRF|PAY) CREDIT ABSA BANK)\s*/i,'')
    .replace(/^[A-Z]{0,2}\d{6,}\s*/,'')
    .replace(/\s*CARD NO\.?\s*\d+\s*$/i,'')
    .replace(/^(Yoco|PAYFAST|DL|TABBS|Express)\s*\*\s*/i,'')
    .trim();
}
function classify(desc, amount){
  const d = ' ' + String(desc).toLowerCase() + ' ';
  const byName = n => S.categories.find(c => c.name.toLowerCase() === n.toLowerCase());
  for (const r of S.rules){
    if (d.includes(r.match.toLowerCase())){
      if (r.kind) return { kind:r.kind, catId:null };
      if (catById(r.catId)) return { kind: amount < 0 ? 'expense' : 'income', catId:r.catId };
    }
  }
  for (const [m, target] of BUILTIN_RULES){
    if (!d.includes(m)) continue;
    if (target === '@income') return { kind:'income', catId:null };
    if (target === '@transfer') return { kind:'transfer', catId:null };
    const c = byName(target); if (c && amount < 0) return { kind:'expense', catId:c.id };
  }
  return { kind: amount < 0 ? 'expense' : 'income', catId:null };
}
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',' || ch === ';'){ row.push(f); f=''; }
    else if (ch === '\n' || ch === '\r'){ if (ch==='\r' && text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f += ch;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function parseDate(s){
  s = String(s).trim();
  let m;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
const parseAmt = s => { const n = parseFloat(String(s).replace(/[R\s]/g,'').replace(/,(?=\d{2}$)/,'.').replace(/,/g,'')); return isNaN(n) ? null : n; };
function planImport(text){
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('That file is empty.');
  const h = rows[0].map(x => x.trim().toLowerCase());
  const di = h.findIndex(x => x.includes('date')), de = h.findIndex(x => x.includes('desc') || x.includes('narr') || x.includes('details')), ai = h.findIndex(x => x.includes('amount'));
  if (di < 0 || de < 0 || ai < 0) throw new Error('Expected columns Date, Description and Amount. Use your bank’s CSV statement export.');
  const existing = new Set(S.tx.filter(t => t.bankKey).map(t => t.bankKey));
  const used = new Set();
  const plan = { add:[], matched:[], dupes:0, skipped:0, rows:[], minDate:null, maxDate:null };
  for (const r of rows.slice(1)){
    const date = parseDate(r[di]), amount = parseAmt(r[ai]), desc = (r[de]||'').trim();
    if (!date || amount === null){ plan.skipped++; continue; }
    if (amount === 0){ plan.skipped++; continue; }
    if (!plan.minDate || date < plan.minDate) plan.minDate = date;
    if (!plan.maxDate || date > plan.maxDate) plan.maxDate = date;
    plan.rows.push({ date, amount, kind: classify(desc, amount).kind });
    let bankKey = `${date}|${amount}|${desc}`, n = 1;
    while (used.has(bankKey)) bankKey = `${date}|${amount}|${desc}|${++n}`;
    used.add(bankKey);
    if (existing.has(bankKey)){ plan.dupes++; continue; }
    const cls = classify(desc, amount), abs = Math.abs(amount);
    {
      const bd = parseISO(date);
      const cand = S.tx.find(t => !t.bankKey && t.kind===cls.kind && !plan.matched.some(m=>m.tx===t) && (() => {
        const dd = Math.abs(daysBetween(parseISO(t.date), bd));
        if (t.source === 'recurring') return dd <= 6 && Math.abs(t.amount - abs) <= Math.max(2, abs*0.06) && (!cls.catId || cls.catId === t.catId);
        return dd <= 3 && Math.abs(t.amount - abs) < 0.01;
      })());
      if (cand){ plan.matched.push({ tx:cand, date, amount:abs, desc, bankKey }); continue; }
    }
    plan.add.push({ id:uid(), date, amount:abs, kind:cls.kind, catId:cls.catId, note:'', bank:desc, merchant:cleanDesc(desc), bankKey, source:'import', inflow: amount > 0 });
  }
  return plan;
}
function applyImport(plan){
  for (const m of plan.matched){ Object.assign(m.tx, { date:m.date, amount:m.amount, bank:m.desc, merchant:cleanDesc(m.desc), bankKey:m.bankKey }); }
  for (const t of plan.add){
    if (t.kind === 'expense' && t.inflow){ t.kind = 'income'; }
    delete t.inflow; S.tx.push(t);
  }
  save();
}
function learnRule(t){
  if (!t.merchant || !t.catId) return 0;
  const match = t.merchant.toLowerCase().split(' ').slice(0,3).join(' ');
  if (match.length < 3) return 0;
  const ex = S.rules.find(r => r.match === match);
  if (ex) ex.catId = t.catId; else S.rules.unshift({ match, catId:t.catId });
  let n = 0;
  for (const o of S.tx) if (o !== t && o.kind==='expense' && !o.catId && o.merchant && o.merchant.toLowerCase().startsWith(match)){ o.catId = t.catId; n++; }
  return n;
}

/* ---------- export ---------- */
function csvCell(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function exportCSV(){
  const head = ['date','amount','kind','category','group','note','bank_description','source','paid_from_fund','budget_period'];
  const lines = [head.join(',')];
  for (const t of [...S.tx].sort((a,b)=>a.date.localeCompare(b.date))){
    const c = catById(t.catId);
    lines.push([t.date, t.amount.toFixed(2), t.kind, c ? c.name : (t.kind==='expense'?'Uncategorised':''), c ? c.group : '', t.note, t.bank, t.source, t.fromFund?'yes':'', periodOf(parseISO(t.date)).key].map(csvCell).join(','));
  }
  lines.push('');
  lines.push('# budget');
  lines.push('category,group,monthly_budget,fixed');
  for (const c of S.categories) lines.push([c.name,c.group,c.budget,c.fixed?'yes':''].map(csvCell).join(','));
  return lines.join('\n');
}
async function deliver(name, text, type){
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files:[file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)){ await navigator.share({ files:[file], title:name }); return true; }
  } catch(e){ if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}
function claudeSummary(){
  const p = periodOf(today()), { sp, flexBudget, flexSpent } = summary(p);
  const lines = [`Beursie summary for budget period ${p.label} (as of ${short(today())}).`, `Salary: ${R(+S.salary||0)}. Flexible spending: ${R(flexSpent)} of ${R(flexBudget)}.`, '', 'Category | spent | budget'];
  for (const g of GROUPS) for (const c of S.categories.filter(c=>c.group===g)) lines.push(`${c.name} (${g}) | ${R(sp[c.id]||0)} | ${R(+c.budget||0)}`);
  lines.push('', `Lumpsum fund: ${R(fundBalance())} (floor ${R(floorAmt())}).`);
  const al = alertsFor(p).filter(a=>a.lvl!=='info'); if (al.length){ lines.push('', 'Alerts:'); al.forEach(a=>lines.push('- '+a.text)); }
  return lines.join('\n');
}

function key(k){

  else { if (a.includes('.') && a.split('.')[1].length >= 2) return; if (a === '0') a = ''; if (a.replace('.','').length >= 8) return; a += k; }
  draft.amount = a; renderAdd();
}

function txFeedback(t, before){
  const c = catById(t.catId), amount = t.amount;
  if (t.kind === 'income') return [`Saved ${R(amount,2)} received.`, ''];
  if (t.kind === 'transfer') return [`Saved ${R(amount,2)} moved. Not counted as spending.`, ''];
  if (c && c.fund && !t.fromFund) return [`Saved. Lumpsum fund is now ${R(fundBalance())}.`, ''];
  if (c && c.group === 'Saving') return [`Saved ${R(amount)} to ${c.name}.`, ''];
  if (t.fromFund){
    const after = fundBalance(), fl = floorAmt(), g = S.goals.find(x => x.id === t.goalId);
    if (fl && after < fl && before >= fl){ notify('Lumpsum fund is below the emergency floor.'); return [`Saved. This took the lumpsum fund below its floor by ${R(fl-after)}.`, 'bad']; }
    if (g) return [`Saved from ${g.name}. ${R(Math.max(0,goalSaved(g)))} left in that goal.`, goalSaved(g) < 0 ? 'warn' : ''];
    return [`Saved from the fund. ${R(Math.max(0,freeMoney()))} free money left.`, freeMoney() < 0 ? 'warn' : ''];
  }
  const r = checkThresholds(t.catId);
  if (isFlex(c) && t.date === iso(today()) && !(r && r.lvl === 'bad')){
    const d = daily();
    if (d.left < 0) return [`Saved. You're ${R(-d.left)} over today's ${R(d.allowance)}. Tomorrow's allowance drops to ${R(d.tomorrow)}.`, 'warn'];
    return [`Saved. ${R(d.left)} left to spend today.${r && r.lvl ? ' ' + r.msg : ''}`, r && r.lvl ? r.lvl : ''];
  }
  return [`Saved. ${r ? r.msg : ''}`, r && r.lvl ? r.lvl : ''];
}
function removeTx(id){

function recordTx(t){ // call from a tap: may also run the weekly Drive backup
  const before = fundBalance();

  const extra = (c && c.fund && !t.fromFund && t.kind === 'expense') ? autoAllocate(t) : '';

  if (extra) msg += ' ' + extra;

function saveDraft(){

function favSuggestions(){
  const since = iso(new Date(Date.now() - 120*86400000)), m = {};
  for (const t of S.tx){
    if (t.kind !== 'expense' || !t.catId || t.fromFund || t.source === 'recurring' || t.date < since) continue;
    const c = catById(t.catId); if (!c || c.fixed || c.group === 'Saving' || /bank fee/i.test(c.name)) continue;
    const label = (t.note || t.merchant || '').trim(); if (!label) continue;
    const k = label.toLowerCase() + '|' + t.amount;
    (m[k] = m[k] || { label, amount:t.amount, catId:t.catId, n:0 }).n++;
  }
  return Object.values(m).filter(x => x.n >= 3 && !S.favs.some(f => f.label.toLowerCase() === x.label.toLowerCase() && f.amount === x.amount)).sort((a,b) => b.n - a.n).slice(0, 6);

/* ---------- fund goals ---------- */
function goalSaved(g){
  let v = 0;
  for (const m of S.goalMoves) if (m.goalId === g.id) v += m.amount;
  for (const t of S.tx) if (t.kind === 'expense' && t.fromFund && t.goalId === g.id) v -= t.amount;
  return round2(v);
}
const allocated = () => S.goals.reduce((a,g) => a + Math.max(0, goalSaved(g)), 0);
const freeMoney = () => round2(fundBalance() - floorAmt() - allocated());
function autoAllocate(t){
  const goals = S.goals.filter(g => +g.monthly > 0 && (!(+g.target) || goalSaved(g) < +g.target));
  if (!goals.length) return '';
  let avail = Math.min(t.amount, Math.max(0, freeMoney()));
  if (avail <= 0) return 'It filled the emergency floor first.';
  const parts = [];
  for (const g of goals){
    const room = +g.target > 0 ? Math.max(0, g.target - goalSaved(g)) : Infinity;
    const give = round2(Math.min(+g.monthly, room, avail));
    if (give <= 0) continue;
    S.goalMoves.push({ id:uid(), goalId:g.id, amount:give, date:t.date, txId:t.id, note:'From contribution' });
    avail = round2(avail - give); parts.push(`${R(give)} to ${g.name}`);
    if (avail <= 0) break;
  }
  return parts.length ? `Goals: ${parts.join(', ')}.` : '';
}

function burnChart(){
  const d = daily(), p = d.p, len = daysBetween(p.start, p.end) + 1, gone = len - d.daysLeft + 1;
  const cum = []; let run = 0;
  const byDay = {};
  for (const t of S.tx){ if (!countsInBudget(t) || !inPeriod(t,p)) continue; const c = catById(t.catId); if (isFlex(c)) byDay[t.date] = (byDay[t.date]||0) + t.amount; }
  for (let i = 0; i < gone; i++){ const ds = iso(new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate()+i)); run += byDay[ds]||0; cum.push(run); }
  const pace = gone ? run / gone : 0, projected = pace * len, B = d.flexBudget;

  const max = Math.max(B, projected, run, 1) * 1.08;

  const actual = cum.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  const area = `${x(0)},${y(0)} ${actual} ${x(gone-1)},${y(0)}`;
  const over = projected > B * 1.005;
  const ticks = [0, Math.floor((len-1)/2), len-1].map(i => { const dt = new Date(p.start.getFullYear(), p.start.getMonth(), p.start.getDate()+i); return `<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===len-1?'end':'middle'}">${short(dt)}</text>`; }).join('');
  const lab = (v, txt, cls) => `<text x="${W-Rm+6}" y="${y(v)+4}" style="fill:var(--${cls})">${txt}</text>`;
  let yB = y(B), yP = y(projected); if (Math.abs(yB - yP) < 13){ if (yP < yB) yP = yB - 13; else yP = yB + 13; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running flexible spending against an even pace to budget">
    <line x1="${L}" x2="${W-Rm}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)"/>
    <line x1="${L}" x2="${W-Rm}" y1="${y(B)}" y2="${y(B)}" style="stroke:var(--line);stroke-dasharray:2 3"/>
    <polyline points="${x(0)},${y(0)} ${x(len-1)},${y(B)}" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4"/>
    <polygon points="${area}" style="fill:var(--${over?'bad':'accent'});opacity:.12"/>
    <polyline points="${actual}" style="fill:none;stroke:var(--${over?'bad':'accent'});stroke-width:2.5;stroke-linejoin:round"/>
    <polyline points="${x(gone-1)},${y(run)} ${x(len-1)},${y(projected)}" style="fill:none;stroke:var(--${over?'bad':'accent'});stroke-width:1.5;stroke-dasharray:1.5 3.5"/>
    <circle cx="${x(gone-1)}" cy="${y(run)}" r="4" style="fill:var(--${over?'bad':'accent'})"/>
    <text x="${x(gone-1)}" y="${y(run)-9}" text-anchor="${gone-1 > len*0.7 ? 'end' : 'middle'}" style="fill:var(--ink);font-weight:600">${R(run)}</text>
    <text x="${W-Rm+6}" y="${yB+4}" style="fill:var(--muted)">Budget</text>
    <text x="${W-Rm+6}" y="${yB+16}" style="fill:var(--muted)">${Math.round(B/100)/10}k</text>
    ${Math.abs(projected - B) > B*0.03 ? `<text x="${W-Rm+6}" y="${yP+4 + (yP<yB?-12:12)}" style="fill:var(--${over?'bad':'good'});font-weight:600">→ ${Math.round(projected/100)/10}k</text>` : ''}
    ${ticks}
  </svg>`;
}
function trendChart(){
  const cur = periodOf(today()), ps = [];
  for (let i = 5; i >= 0; i--) ps.push(shiftPeriod(cur, -i));
  const flex = S.categories.filter(c => !c.fixed && c.group !== 'Saving');
  const budget = flex.reduce((a,c)=>a+(+c.budget||0),0);
  const vals = ps.map(p => { const sp = spentBy(p); return flex.reduce((a,c)=>a+(sp[c.id]||0),0); });
  const max = Math.max(budget, ...vals, 1) * 1.1, W = 340, H = 150, top = 10, bot = 22, left = 4, bw = (W - left) / ps.length;
  const y = v => top + (H - top - bot) * (1 - v / max);
  const bars = ps.map((p,i) => { const v = vals[i], x = left + i*bw + bw*0.2, w = bw*0.6, over = budget && v > budget;
    return `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, H-bot-y(v))}" rx="3" style="fill:var(--${over?'bad':'accent'});opacity:${i===5?1:.55}"/>
            <text x="${x+w/2}" y="${H-6}" text-anchor="middle">${MONTHS[p.end.getMonth()]}</text>
            ${v?`<text x="${x+w/2}" y="${y(v)-4}" text-anchor="middle">${Math.round(v/100)/10}k</text>`:''}`; }).join('');
  const line = budget ? `<line x1="0" x2="${W}" y1="${y(budget)}" y2="${y(budget)}" style="stroke:var(--ink);stroke-dasharray:4 3;opacity:.6"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flexible spending for the last six periods">${line}${bars}</svg>`;
}

/* ---------- history ---------- */
function renderHistory(){
  const p = histPeriod || periodOf(today());
  let list = S.tx.filter(t => inPeriod(t, p));
  const fundCat = c => c && c.fund;
  if (histFilter === 'review') list = S.tx.filter(t => t.kind==='expense' && !t.catId);
  else if (histFilter === '@in') list = list.filter(t => t.kind !== 'expense');
  else if (histFilter === '@today') list = S.tx.filter(t => t.date === iso(today()));
  else if (histFilter === '@fund') list = S.tx.filter(t => t.kind==='expense' && (t.fromFund || fundCat(catById(t.catId))));
  else if (histFilter === '@flex') list = list.filter(t => { const c = catById(t.catId); return countsInBudget(t) && c && !c.fixed && c.group !== 'Saving'; });
  else if (histFilter !== 'all') list = list.filter(t => t.catId === histFilter);
  list.sort((a,b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
  const reviewN = S.tx.filter(t => t.kind==='expense' && !t.catId).length;
  const total = list.filter(countsInBudget).reduce((a,t)=>a+t.amount,0);
  const days = {}; list.forEach(t => (days[t.date] = days[t.date] || []).push(t));
  app.innerHTML = `
  <div class="topbar"><div class="brand">History</div>
    ${histFilter==='review' || histFilter==='@fund' || histFilter==='@today' ? '' : `<div class="row"><button class="ghost" data-nav="-1" aria-label="Previous period">‹</button><span class="num" style="font-size:.85rem">${esc(p.label)}</span><button class="ghost" data-nav="1" aria-label="Next period">›</button></div>`}</div>
  <div class="scroller" id="filters">
    <button class="ghost" data-f="all" aria-pressed="${histFilter==='all'}">All</button>
    ${reviewN ? `<button class="ghost" data-f="review" aria-pressed="${histFilter==='review'}">Needs category (${reviewN})</button>` : ''}
    ${S.categories.map(c=>`<button class="ghost" data-f="${c.id}" aria-pressed="${histFilter===c.id}">${esc(c.name)}</button>`).join('')}
    <button class="ghost" data-f="@in" aria-pressed="${histFilter==='@in'}">Income & transfers</button>
    <button class="ghost" data-f="@today" aria-pressed="${histFilter==='@today'}">Today</button>
    <button class="ghost" data-f="@flex" aria-pressed="${histFilter==='@flex'}">Flexible only</button>
    <button class="ghost" data-f="@fund" aria-pressed="${histFilter==='@fund'}">Fund in & out</button>
  </div>
  ${histHeader(p)}
  <p class="muted num" style="margin:10px 0 0;font-size:.85rem">${list.length} transaction${list.length===1?'':'s'}${total?` · ${R(total,2)} counted in budget`:''}</p>
  ${histFilter==='review' && reviewN ? '<p class="muted" style="font-size:.85rem;margin:6px 0 0">Tap one to pick its category. Beursie remembers the shop and files it automatically next time.</p>' : ''}
  <div>${Object.keys(days).map(d => `<div class="day"><div class="eyebrow">${short(parseISO(d))}</div>${days[d].map(t => {
    const c = catById(t.catId);
    const title = t.note || t.merchant || (c ? c.name : 'Transaction');
    const sub = t.kind==='income' ? 'Income' : t.kind==='transfer' ? 'Transfer (not counted)' : c ? c.name + (t.fromFund?' · from fund':'') + (t.source==='recurring'?' · auto':'') : null;
    return `<button class="tx" data-tx="${t.id}"><span class="t">${esc(title)}</span><span class="a ${t.kind!=='expense'?'in':''}">${t.kind==='expense'?'':'+'}${R(t.amount,2)}</span><span class="s ${sub?'':'review'}">${esc(sub || 'Needs a category')}</span><span class="s" style="text-align:right">${t.bank?'bank':''}</span></button>`;
  }).join('')}</div>`).join('') || '<p class="muted" style="margin-top:24px">Nothing here yet.</p>'}</div>`;
  app.onclick = e => {
    const n = e.target.closest('[data-nav]'); if (n){ histPeriod = shiftPeriod(p, +n.dataset.nav); renderHistory(); return; }
    const f = e.target.closest('[data-f]'); if (f){ histFilter = f.dataset.f; renderHistory(); f.scrollIntoView && f.scrollIntoView({ block:'nearest', inline:'center' }); return; }
    const ad = e.target.closest('[data-add]'); if (ad){ const c = catById(ad.dataset.add); startAdd(c && c.id, +ad.dataset.amt || 0, ad.dataset.kind); return; }
    const t = e.target.closest('[data-tx]'); if (t) editTx(S.tx.find(x => x.id === t.dataset.tx));
  };
}
function histHeader(p){
  if (histFilter === '@today'){ const d = daily(); return `<div class="card row between" style="margin-top:10px"><span class="num"><span class="eyebrow">Today's flexible spending</span><br><b>${R(d.spent)}</b> <span class="muted">of ${R(d.allowance)}</span></span><button class="ghost" data-add="">+ Add</button></div>`; }
  if (histFilter === '@in') return `<div class="card row between" style="margin-top:10px"><span><span class="eyebrow">Money in</span><br><b class="num">${R(incomeIn(p))}</b></span><button class="ghost" data-add="" data-kind="income">+ Add income</button></div>`;
  if (histFilter === '@fund'){ const fb = fundBalance(), fl = floorAmt(), fc = S.categories.find(c => c.fund);
    return `<div class="card stack" style="margin-top:10px;gap:6px"><div class="row between num"><span class="muted">Balance</span><b>${R(fb)}</b></div><div class="row between num"><span class="muted">Floor</span><span>${R(fl)}</span></div>${fc?`<button class="ghost" data-add="${fc.id}" data-amt="${Math.max(0,(+fc.budget||0)-(spentBy(periodOf(today()))[fc.id]||0))}">+ Add a contribution</button>`:''}</div>`; }
  const c = catById(histFilter); if (!c) return '';
  const s = spentBy(p)[c.id] || 0, b = +c.budget || 0, left = b - s, st = catState(c, s);
  const isNow = p.key === periodOf(today()).key;
  const due = (c.fixed || c.group === 'Saving') && s < b * 0.95;
  return `<div class="card stack" style="margin-top:10px;gap:8px">
    <div class="row between num"><span class="muted">${esc(p.label)}</span><span><b>${R(s)}</b> <span class="muted">of ${R(b)}</span></span></div>
    <div class="bar" style="height:8px"><i class="${st==='bad'?'bad':st==='warn'&&!c.fixed?'warn':''}" style="width:${b?Math.min(100,s/b*100):(s?100:0)}%"></i></div>
    <div class="row between"><span class="${left<0?'danger':'muted'}" style="font-size:.88rem">${left>=0?`${R(left)} ${due?'still to pay':'left'}`:`${R(-left)} over budget`}</span>
    ${isNow ? `<button class="ghost" data-add="${c.id}" data-amt="${due?left:0}">${due?`+ Record ${R(left)}`:'+ Add'}</button>` : ''}</div></div>`;
}
function editTx(t){

  sheet(`<div class="stack">

    ${t.bank ? `<p class="muted" style="margin:0;font-size:.8rem;word-break:break-word">Bank: ${esc(t.bank)}</p>` : ''}

    ${t.merchant ? `<label class="toggle"><input type="checkbox" id="eLearn" checked> Always file "${esc(t.merchant.split(' ').slice(0,3).join(' '))}" like this</label>` : ''}
    <button class="primary" id="eSave">Save changes</button>
    <button class="ghost danger" id="eDel">Delete transaction</button></div>`, s => {
    let cat = t.catId;
    const kindSel = s.querySelector('#eKind'), wrap = s.querySelector('#eCatWrap');
    const sync = () => wrap.hidden = kindSel.value !== 'expense'; sync(); kindSel.onchange = sync;
    s.querySelector('#eCats').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; s.querySelectorAll('#eCats .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    s.querySelector('[data-close]').onclick = closeSheet;
    s.querySelector('#eSave').onclick = () => {
      t.amount = round2(Math.abs(parseFloat(s.querySelector('#eAmt').value) || t.amount));
      t.date = s.querySelector('#eDate').value || t.date; t.kind = kindSel.value; t.note = s.querySelector('#eNote').value.trim();
      t.catId = t.kind === 'expense' ? cat : null;
      if (s.querySelector('#eFF').checked){ t.fromFund = true; const eg = s.querySelector('#eGoal'); if (eg && eg.value) t.goalId = eg.value; else delete t.goalId; } else { delete t.fromFund; delete t.goalId; }
      let learned = 0; const lr = s.querySelector('#eLearn');
      if (lr && lr.checked && t.catId) learned = learnRule(t);
      if (lr && lr.checked && t.kind === 'transfer' && t.merchant){ const m = t.merchant.toLowerCase().split(' ').slice(0,3).join(' '); if (!S.rules.some(r=>r.match===m)) S.rules.unshift({ match:m, kind:'transfer' }); }
      save(); closeSheet(); render(); toast(learned ? `Saved. Also filed ${learned} similar transaction${learned>1?'s':''}.` : 'Saved.');
    };
    s.querySelector('#eDel').onclick = () => confirmSheet('Delete this transaction?', 'Delete', () => { removeTx(t.id); render(); toast('Deleted.'); });
  });
}

/* ---------- month review ---------- */
let reviewP = null, recon = null;
function reviewDue(){
  const pp = shiftPeriod(periodOf(today()), -1);
  if (S.reviewed[pp.key] || !S.tx.some(t => inPeriod(t, pp))) return null;
  return pp;
}
function openReview(p){ reviewP = p || shiftPeriod(periodOf(today()), -1); recon = null; go('review'); }
function reconcile(text, p){
  const plan = planImport(text);
  const a = iso(p.start), b = iso(p.end), inP = d => d >= a && d <= b;
  if (!plan.minDate) throw new Error('No transactions found in that file.');
  const from = plan.minDate > a ? plan.minDate : a, to = plan.maxDate < b ? plan.maxDate : b;
  if (from > to) throw new Error(`That statement (${short(parseISO(plan.minDate))} – ${short(parseISO(plan.maxDate))}) doesn’t cover ${p.label}.`);
  const matchedIds = new Set(plan.matched.map(m => m.tx.id));
  const missed = plan.add.filter(t => inP(t.date) && t.kind === 'expense');
  const changed = plan.matched.filter(m => inP(m.date) && Math.abs(m.amount - m.tx.amount) > 0.009);
  const notInBank = S.tx.filter(t => t.kind === 'expense' && inPeriod(t, p) && t.date >= from && t.date <= to && !t.bankKey && !matchedIds.has(t.id))
                        .sort((x,y) => x.date.localeCompare(y.date));
  const bankOut = round2(plan.rows.filter(r => r.amount < 0 && r.kind === 'expense' && r.date >= from && r.date <= to).reduce((s,r) => s - r.amount, 0));
  const appOut = round2(S.tx.filter(t => t.kind === 'expense' && t.date >= from && t.date <= to).reduce((s,t) => s + t.amount, 0));
  return { text, plan, missed, changed, notInBank, from, to, bankOut, appOut, outside: plan.add.length - missed.length, ok: plan.matched.length - changed.length + plan.dupes };
}
function renderReview(){
  const p = reviewP || shiftPeriod(periodOf(today()), -1);
  const { sp, flexBudget, flexSpent } = summary(p);
  const inc = incomeIn(p);
  const counted = S.tx.filter(t => countsInBudget(t) && inPeriod(t, p));
  const saved = round2(counted.filter(t => (catById(t.catId)||{}).group === 'Saving').reduce((a,t) => a + t.amount, 0));
  const living = round2(counted.reduce((a,t) => a + t.amount, 0) - saved);
  const fromFund = round2(S.tx.filter(t => t.kind === 'expense' && t.fromFund && inPeriod(t, p)).reduce((a,t) => a + t.amount, 0));
  const flexLeft = round2(flexBudget - flexSpent);
  const rows = S.categories.filter(c => c.group !== 'Saving').map(c => { const s = sp[c.id] || 0, b = +c.budget || 0; return { c, s, b, d: round2(b - s) }; });
  const best = rows.filter(r => isFlex(r.c) && r.b > 0 && r.d > 0).sort((x,y) => y.d - x.d)[0];
  const worst = rows.filter(r => r.d < -0.5).sort((x,y) => x.d - y.d)[0];
  const isPast = p.end < today(), done = S.reviewed[p.key];
  const rolledTx = S.tx.find(t => t.id === S.rolled[p.key]);
  const nextP = shiftPeriod(p, 1);
  app.innerHTML = `
  <div class="topbar"><div class="brand">Month review</div>
    <div class="row"><button class="ghost" data-nav="-1" aria-label="Previous period">‹</button><span class="num" style="font-size:.85rem">${esc(p.label)}</span><button class="ghost" data-nav="1" aria-label="Next period" ${nextP.start > today() ? 'disabled' : ''}>›</button></div></div>
  <div class="stack">
    ${!isPast ? '<div class="alert info"><span class="dot"></span><span>This month isn’t over yet, so these are the figures so far.</span></div>' : ''}
    <div class="grid2">
      <div class="stat"><span class="eyebrow">Money in</span><b>${R(inc)}</b></div>
      <div class="stat"><span class="eyebrow">Living costs</span><b>${R(living)}</b></div>
      <div class="stat"><span class="eyebrow">Saved</span><b class="good-t">${R(saved)}</b><span class="muted" style="font-size:.78rem">${inc ? Math.round(saved/inc*100) + '% of money in' : ''}</span></div>
      <div class="stat"><span class="eyebrow">Flexible budget</span><b class="${flexLeft < 0 ? 'bad-t' : 'good-t'}">${flexLeft < 0 ? R(-flexLeft) + ' over' : R(flexLeft) + ' under'}</b><span class="muted" style="font-size:.78rem">${R(flexSpent)} of ${R(flexBudget)}</span></div>
    </div>
    ${best || worst || fromFund ? `<div class="card stack" style="gap:6px">
      ${best ? `<div>Best: <b>${esc(best.c.name)}</b>, ${R(best.d)} under budget.</div>` : ''}
      ${worst ? `<div>Watch: <b>${esc(worst.c.name)}</b>, ${R(-worst.d)} over budget.</div>` : ''}
      ${fromFund ? `<div class="muted">${R(fromFund)} was paid from the lumpsum fund and isn’t counted above.</div>` : ''}</div>` : ''}
    <div class="card">
      <h2>Category by category</h2>
      <div style="overflow-x:auto"><table class="rtable"><thead><tr><th>Category</th><th>Spent</th><th>Budget</th><th>Diff</th></tr></thead><tbody>
      ${rows.sort((x,y) => x.d - y.d).map(r => `<tr data-cat="${r.c.id}"><td>${esc(r.c.name)}</td><td>${R(r.s)}</td><td class="muted">${R(r.b)}</td><td class="${r.d < -0.5 ? 'bad-t' : r.d > 0.5 ? 'good-t' : 'muted'}">${r.d > 0.5 ? '+' : ''}${R(r.d)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="card stack" id="bankcheck">
      <h2>Check against your bank</h2>
      ${!recon ? `<p class="muted" style="margin:0;font-size:.88rem">Download your statement for this month as a CSV from your banking app and choose it here. Beursie lists what it missed, what’s in Beursie but not on the statement, and where amounts differ. Nothing changes until you confirm.</p>
        <button class="primary" data-act="recon">Choose bank statement (CSV)</button>` : reconHTML(recon)}
    </div>
    ${isPast && flexLeft > 0 ? `<div class="card stack">
      <h2>Roll over what’s left</h2>
      ${rolledTx ? `<p style="margin:0">${R(rolledTx.amount)} moved to the lumpsum fund. <span class="muted">Undo it by deleting the "Rollover" entry in History.</span></p>`
      : `<p class="muted" style="margin:0;font-size:.88rem">You came in ${R(flexLeft)} under your flexible budget. Move it into the lumpsum fund so a good month grows your savings. Do the same transfer in your banking app.</p>
      <div class="row" style="gap:8px"><input type="number" inputmode="decimal" id="rollAmt" value="${Math.floor(flexLeft/10)*10}" aria-label="Amount to roll over" style="flex:1;min-width:0"><button class="primary" data-act="roll" style="width:auto;padding:12px 16px">Move to fund</button></div>`}
    </div>` : ''}
    ${done ? `<p class="muted" style="text-align:center;margin:4px 0">Review done on ${short(parseISO(done))}.</p>` : `<button class="ghost" data-act="done">${isPast ? 'Mark this review done' : 'Close'}</button>`}
    <button class="link" data-act="export" style="align-self:center">Export everything as CSV for Claude</button>
  </div>`;
  app.onclick = async e => {
    const n = e.target.closest('[data-nav]'); if (n && !n.disabled){ reviewP = shiftPeriod(p, +n.dataset.nav); recon = null; renderReview(); return; }
    const cr = e.target.closest('tr[data-cat]'); if (cr){ go('history', { filter:cr.dataset.cat, period:p }); return; }
    const del = e.target.closest('[data-rdtx]'); if (del){ removeTx(del.dataset.rdtx); recon = reconcile(recon.text, p); renderReview(); toast('Deleted.'); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'recon') pickFile('recon');
    if (a.dataset.act === 'reconapply'){ const n1 = recon.missed.length, n2 = recon.changed.length, n3 = recon.outside; applyImport(recon.plan); recon = reconcile(recon.text, p); renderReview(); toast(`Added ${n1 + n3} and corrected ${n2}.`); }
    if (a.dataset.act === 'roll'){ const amt = round2(parseFloat(app.querySelector('#rollAmt').value) || 0); const fc = S.categories.find(c => c.fund);
      if (!fc) return toast('Tick "Fund" on one category in the Budget tab first.', 'warn'); if (!(amt > 0)) return;
      const t = { id:uid(), date:iso(p.end), amount:amt, kind:'expense', catId:fc.id, note:`Rollover from ${p.label}`, source:'rollover' };
      S.rolled[p.key] = t.id; recordTx(t); renderReview(); }
    if (a.dataset.act === 'done'){ if (isPast){ S.reviewed[p.key] = iso(today()); save(); toast('Review done. See you next month.'); } go('overview'); }
    if (a.dataset.act === 'export'){ if (await deliver(`beursie-transactions-${iso(today())}.csv`, exportCSV(), 'text/csv')) toast('Exported. Share it with Claude for a deeper look.'); }
  };
}
function reconHTML(r){
  const diff = round2(r.bankOut - r.appOut);
  const line = (t, right, small) => `<div class="rline"><span>${t}</span><span class="num">${right}</span>${small ? `<small>${small}</small>` : ''}</div>`;
  const clean = !r.missed.length && !r.changed.length && !r.notInBank.length;
  return `<p class="muted" style="margin:0;font-size:.85rem">Compared ${short(parseISO(r.from))} – ${short(parseISO(r.to))}, the days this statement and month have in common.</p>
    <div class="grid2"><div class="stat"><span class="eyebrow">Bank: spending</span><b>${R(r.bankOut)}</b></div><div class="stat"><span class="eyebrow">Beursie</span><b>${R(r.appOut)}</b><span class="${Math.abs(diff) < 1 ? 'good-t' : 'muted'}" style="font-size:.78rem">${Math.abs(diff) < 1 ? 'Matches' : (diff > 0 ? R(diff) + ' missing in Beursie' : R(-diff) + ' more in Beursie')}</span></div></div>
    ${clean ? '<div class="alert info"><span class="dot"></span><span>Everything lines up. Nice.</span></div>' : ''}
    ${r.missed.length ? `<div><div class="eyebrow">Missed: on the statement, not in Beursie (${r.missed.length})</div>${r.missed.slice(0, 12).map(t => line(esc(t.merchant || t.bank), R(t.amount, 2), `${short(parseISO(t.date))} · ${t.catId ? esc(catById(t.catId).name) : 'needs a category'}`)).join('')}${r.missed.length > 12 ? `<p class="muted" style="font-size:.8rem;margin:6px 0 0">…and ${r.missed.length - 12} more.</p>` : ''}</div>` : ''}
    ${r.changed.length ? `<div><div class="eyebrow">Amounts that differ (${r.changed.length})</div>${r.changed.map(m => line(esc(m.tx.note || (catById(m.tx.catId)||{}).name || m.desc), `${R(m.tx.amount, 2)} → ${R(m.amount, 2)}`, `${short(parseISO(m.date))} · bank amount will be used`)).join('')}</div>` : ''}
    ${r.notInBank.length ? `<div><div class="eyebrow">In Beursie, not on the statement (${r.notInBank.length})</div><p class="muted" style="font-size:.8rem;margin:4px 0">Could be cash, something not cleared yet, a duplicate, or a monthly payment that didn’t go off. Delete the ones that didn’t happen.</p>${r.notInBank.map(t => `<div class="rline"><span>${esc(t.note || (catById(t.catId)||{}).name || 'Entry')} · <span class="num">${R(t.amount, 2)}</span></span><button class="link danger" data-rdtx="${t.id}">Delete</button><small>${short(parseISO(t.date))}${t.source === 'recurring' ? ' · auto monthly payment' : ''}${t.fromFund ? ' · from fund' : ''}</small></div>`).join('')}</div>` : ''}
    ${r.missed.length || r.changed.length || r.outside ? `<button class="primary" data-act="reconapply">Add ${r.missed.length + r.outside} missing${r.changed.length ? ` and fix ${r.changed.length} amount${r.changed.length > 1 ? 's' : ''}` : ''}</button>
      ${r.outside ? `<p class="muted" style="margin:0;font-size:.8rem">Includes ${r.outside} new transaction${r.outside > 1 ? 's' : ''} from outside this month (income, transfers or other days).</p>` : ''}` : ''}

}

/* ---------- Google Drive backup ---------- */
const DRIVE_FILE = 'Beursie backup.json', DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let gisLoading = null, tokenClient = null, tokenWait = null, driveToken = null;
function initDrive(){
  if (!S.drive.clientId || tokenClient) return;
  if (!gisLoading) gisLoading = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = res; sc.onerror = () => { gisLoading = null; rej(); }; document.head.appendChild(sc); });
  gisLoading.then(() => {
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id:S.drive.clientId, scope:DRIVE_SCOPE,
      callback: r => { const w = tokenWait; tokenWait = null; if (!w) return; if (r.error) w.rej(new Error('Google said: ' + (r.error_description || r.error))); else { driveToken = { v:r.access_token, exp:Date.now() + (r.expires_in || 3600) * 1000 }; w.res(driveToken.v); } },
      error_callback: e => { const w = tokenWait; tokenWait = null; if (w) w.rej(new Error(e && e.type === 'popup_closed' ? 'Google sign-in was closed before it finished.' : 'Google sign-in was blocked. Try again from the Budget tab.')); } });
  }).catch(() => {});
}
function getToken(prompt){ // call straight from a tap so the Google window may open
  if (driveToken && driveToken.exp > Date.now() + 60000) return Promise.resolve(driveToken.v);
  if (!tokenClient){ initDrive(); return Promise.reject(new Error('Google is still loading or offline. Try again in a few seconds.')); }
  return new Promise((res, rej) => { tokenWait = { res, rej }; tokenClient.requestAccessToken({ prompt }); });
}
async function driveUpload(token){
  const H = { Authorization:'Bearer ' + token }, body = JSON.stringify(S);
  if (S.drive.fileId){
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${S.drive.fileId}?uploadType=media`, { method:'PATCH', headers:Object.assign({ 'Content-Type':'application/json' }, H), body });
    if (r.ok) return;
    if (r.status !== 404) throw new Error(`Drive backup failed (error ${r.status}).`);
  }
  const bd = 'beursie' + uid();
  const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name:DRIVE_FILE, mimeType:'application/json' })}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method:'POST', headers:Object.assign({ 'Content-Type':'multipart/related; boundary=' + bd }, H), body:mp });
  if (!r.ok) throw new Error(`Drive backup failed (error ${r.status}).`);
  S.drive.fileId = (await r.json()).id;
}
function driveBackup(prompt, quiet){
  return getToken(prompt).then(driveUpload).then(() => {
    S.drive.connected = true; S.drive.last = iso(today()); delete S.drive.failed; save();
    if (!quiet){ toast('Backed up to Google Drive.'); if (tab === 'budget') renderBudget(); }
  }).catch(e => { if (quiet){ S.drive.failed = iso(today()); save(); } else toast(e.message, 'bad'); });
}
const driveDue = () => !!(S.drive.connected && S.drive.auto && (!S.drive.last || daysBetween(parseISO(S.drive.last), today()) >= 7));
function driveRestore(){
  getToken(S.drive.connected ? '' : 'consent').then(async token => {
    const H = { Authorization:'Bearer ' + token };
    let id = S.drive.fileId;
    if (!id){
      const q = encodeURIComponent(`name='${DRIVE_FILE}' and trashed=false`);
      const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,modifiedTime)&pageSize=1`, { headers:H });
      const j = r.ok ? await r.json() : { files:[] };
      if (!j.files || !j.files.length) throw new Error('No Beursie backup found in this Google Drive.');
      id = j.files[0].id;
    }
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers:H });
    if (!r.ok) throw new Error(`Couldn’t read the Drive backup (error ${r.status}).`);
    const text = await r.text();
    loadJSON(text, () => { S.drive.connected = true; S.drive.fileId = id; save(); });
  }).catch(e => toast(e.message, 'bad'));
}

/* ---------- files in ---------- */
const fileIn = document.getElementById('fileIn');
let fileMode = 'csv';
function pickFile(mode){ fileMode = mode; fileIn.value = ''; fileIn.accept = mode === 'json' ? '.json,application/json' : '.csv,text/csv'; fileIn.click(); }
fileIn.onchange = async () => {
  const f = fileIn.files[0]; if (!f) return;
  const text = await f.text();
  if (fileMode === 'json' || /\.json$/i.test(f.name)) return loadJSON(text);
  if (fileMode === 'recon'){ try { recon = reconcile(text, reviewP); renderReview(); const bc = document.getElementById('bankcheck'); bc && bc.scrollIntoView({ block:'start' }); } catch(err){ toast(err.message, 'bad'); } return; }
  try {
    const plan = planImport(text);
    const exp = plan.add.filter(t => t.kind==='expense'), unc = exp.filter(t=>!t.catId).length;
    const other = plan.add.length - exp.length;
    sheet(`<div class="stack"><h2>Import ${esc(f.name)}</h2>
      <div><div class="sumrow"><span>New spending</span><b>${exp.length}</b></div>
      <div class="sumrow"><span class="muted">… of which need a category</span><span>${unc}</span></div>
      <div class="sumrow"><span>Matched to entries you already logged</span><b>${plan.matched.length}</b></div>
      <div class="sumrow"><span>Income & transfers (not counted)</span><span>${other}</span></div>
      <div class="sumrow"><span class="muted">Already imported, skipped</span><span>${plan.dupes}</span></div></div>
      <p class="muted" style="margin:0;font-size:.85rem">Matched entries keep your category and note, and take the bank's exact amount and date.</p>
      <button class="primary" id="impGo" ${plan.add.length+plan.matched.length?'':'disabled'}>Import</button></div>`, s => {
      s.querySelector('#impGo').onclick = () => { applyImport(plan); closeSheet(); if (unc){ histFilter='review'; go('history'); } else render(); toast(`Imported ${plan.add.length + plan.matched.length} transactions.`); };
    });
  } catch(err){ toast(err.message, 'bad'); }
};
function loadJSON(text, after){
  let d; try { d = JSON.parse(text); } catch(e){ return toast('That file isn’t valid JSON.', 'bad'); }
  if (d && d.v === 1 && Array.isArray(d.tx)){ // full backup
    const go2 = () => { const keepDrive = S.drive; S = Object.assign(blankState(), d); S.drive = Object.assign(blankState().drive, d.drive || {}, keepDrive.clientId ? { clientId:keepDrive.clientId } : {}); S.setupDone = true; after && after(); save(); render(); toast(`Restored ${S.tx.length} transactions.`); };
    if (S.tx.length) confirmSheet('Replace everything on this device with this backup?', 'Restore backup', go2); else go2();
    return;
  }
  if (d && d.starter && Array.isArray(d.categories)){ // starter
    const keepTx = S.tx;
    S = Object.assign(blankState(), { salary:d.salary||0, startDay:d.startDay||25, alertPct:d.alertPct||80, monthsCover:d.monthsCover??3, fundOpening:d.fundBalance||0,
      categories:d.categories.map(c => ({ id:c.id||uid(), name:c.name, group:GROUPS.includes(c.group)?c.group:'Lifestyle', budget:+c.budget||0, fixed:!!c.fixed, fund:!!c.fund })),
      recurring:(d.recurring||[]).map(r => ({ id:uid(), catId:r.catId, amount:+r.amount||0, day:+r.day||1, note:r.note||'', active:r.active!==false })),
      rules:d.rules||[], tx:keepTx, setupDone:true, autoFrom:iso(today()) });
    save(); const n = postRecurring(); tab = 'overview'; render();
    toast(`Budget loaded. Monthly payments will be added from today on. Import a bank statement to fill in what already happened.`);
    return;
  }
  toast('That isn’t a Beursie backup or starter file.', 'bad');
}

/* ---------- boot ---------- */
load();
const posted = S.setupDone ? postRecurring() : 0;
(() => { const q = new URLSearchParams(location.search).get('go');
  if (q && S.setupDone){
    if (q === 'today'){ tab = 'history'; histFilter = '@today'; }
    else if (q === 'review'){ reviewP = reviewDue() || shiftPeriod(periodOf(today()), -1); tab = 'review'; }
    else if (['add','overview','history','budget'].includes(q)) tab = q;
    try { history.replaceState({ tab, filter:histFilter, pkey:null }, '', location.pathname); } catch(e){}
  } })();
render();
initDrive();
if (posted) toast(`Added ${posted} monthly payment${posted>1?'s':''} for this period.`);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.setupDone){ const n = postRecurring(); if (n){ render(); toast(`Added ${n} monthly payment${n>1?'s':''}.`); } } });
</script>
</body>
